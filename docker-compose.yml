services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: dormmatch-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: dormmatch-test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dormmatch-test"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 추가 시 아래 주석 해제
